<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>


    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="

<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">

                        <form id="todoForm">
                            <div class="form-group">
                                <label for="todoInput">Enter Your Todo: </label>
                                <input type="text" required class="form-control" id="todoInput">

                            </div>
                            <button type="submit" id="addTodoBtn" class="bt btn-primary btn-block btn-sm">Add Todo</button>
                            <button type="button" id="UpdateTodoBtn" class="bt btn-primary btn-block btn-sm d-none">Update Todo</button>

                        </form>

                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <ul class="list-group" id="todoList">
                    <!-- <li class="list-group-item d-flex justify-content-between align-items-center">

                            <i class="fa-solid fa-pen-to-square fa-2x text-primary"></i>
                            <i class="fa-solid fa-trash-can fa-2x text-danger"></i>
                        </div>
                    </li> -->

                </ul>
            </div>
        </div>
    </div>







    <script src="./assets/js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
